<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aduan Warga - BersihPoin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="halaman-fitur">
<header class="fitur-header"><a class="merek" href="{{ url_for('portal_operator') }}">BersihPoin · TPS</a>
  <nav class="fitur-nav" aria-label="Navigasi operator"><a href="{{ url_for('portal_operator') }}">Input data</a><a href="{{ url_for('halaman_tps') }}">Kelola TPS</a><a class="aktif" href="{{ url_for('halaman_aduan') }}">Aduan warga</a><a href="{{ url_for('halaman_armada') }}">Armada</a></nav>
  <form action="{{ url_for('logout') }}" method="post"><button class="keluar" type="submit">Keluar</button></form>
</header>
<main class="fitur-main">
  <section class="fitur-intro"><div><p class="label-atas">MASUK LANGSUNG DARI WARGA</p><h1>Aduan dan masukan TPS</h1><p>Daftar ini diperbarui otomatis. Pilih TPS tertentu atau pantau seluruh aduan.</p></div>
    <label class="pilih-tps">Filter TPS <select id="filterTps"><option value="">Semua TPS</option></select></label></section>
  <section class="fitur-kartu"><div id="daftarAduan" class="daftar-aduan" aria-live="polite"></div></section>
</main>
<script>
const $=s=>document.querySelector(s),h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw new Error(d.error||"Permintaan gagal.");return d;}
function waktu(s){return new Date(s).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"});}
async function muat(){
  const rows=await api("/api/operator/aduan?tps="+encodeURIComponent($("#filterTps").value));
  $("#daftarAduan").innerHTML=rows.length?rows.map(a=>`<article class="kartu-aduan"><div class="judul-baris"><div><strong>${h(a.tps)}</strong><span>${a.nama?h(a.nama)+" · ":""}${h(waktu(a.waktu))}</span></div><span class="badge-status ${a.status==="baru"?"baru":"siaga"}">${a.status==="baru"?"Baru":"Ditangani"}</span></div><p>${h(a.isi)}</p>${a.status==="baru"?`<button class="tombol kedua" data-id="${h(a.id)}" type="button">Tandai ditangani</button>`:`<small>Ditangani: ${h(waktu(a.waktu_ditangani))}</small>`}</article>`).join(""):'<p class="bantuan">Belum ada aduan untuk filter ini.</p>';
  document.querySelectorAll(".kartu-aduan button").forEach(b=>b.onclick=async()=>{try{await api("/api/operator/aduan/"+encodeURIComponent(b.dataset.id),{method:"PATCH"});await muat();}catch(e){$("#daftarAduan").insertAdjacentHTML("afterbegin",`<p class="pesan-status">${h(e.message)}</p>`);}});
}
async function mulai(){const tps=await api("/api/operator/tps");$("#filterTps").replaceChildren(new Option("Semua TPS",""),...tps.map(t=>new Option(t.nama,t.nama)));$("#filterTps").onchange=()=>muat().catch(e=>$("#daftarAduan").textContent="Gagal memuat aduan: "+e.message);await muat();setInterval(()=>muat().catch(e=>$("#daftarAduan").textContent="Gagal memperbarui aduan: "+e.message),15000);}
mulai().catch(e=>$("#daftarAduan").textContent=e.message);
</script>
</body>
</html>
